name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Run tests (incl. differential suite vs sqlite3)
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: python demo.py

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build leafdb-core (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y g++ make
          make -C native test
          make -C native build/leafdb-core
      - name: Cross-language compat (Python <-> C++, Linux)
        if: runner.os == 'Linux'
        run: python -m unittest tests.native_compat -v
      - name: Build leafdb-core (Windows/MinGW)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = "$env:RUNNER_TEMP\winlibs.zip"
          Invoke-WebRequest -Uri "https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.1-12.0.0-r2/winlibs-x86_64-posix-seh-gcc-14.2.0-llvm-19.1.1-mingw-w64ucrt-r2.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath C:\winlibs -Force
          $gpp = Get-ChildItem C:\winlibs -Recurse -Filter g++.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:Path = "$(Split-Path $gpp);$env:Path"
          g++ --version
          g++ -std=c++17 -O2 -Wall -Wextra -static -static-libgcc -static-libstdc++ -Inative/include native/src/core.cpp native/tests/test_core.cpp -o native/build/test_core.exe
          .\native\build\test_core.exe
      - name: Cross-language compat (Python <-> C++)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = "$env:RUNNER_TEMP\winlibs.zip"
          Invoke-WebRequest -Uri "https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.1-12.0.0-r2/winlibs-x86_64-posix-seh-gcc-14.2.0-llvm-19.1.1-mingw-w64ucrt-r2.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath C:\winlibs -Force
          $gpp = Get-ChildItem C:\winlibs -Recurse -Filter g++.exe | Select-Object -First 1 -ExpandProperty FullName
          $env:Path = "$(Split-Path $gpp);$env:Path"
          g++ -std=c++17 -O2 -Inative/include native/src/core.cpp native/tools/cli.cpp -o native/build/leafdb-core.exe -static -static-libgcc -static-libstdc++
          python -m unittest tests.native_compat -v
