name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Run tests (incl. differential suite vs sqlite3)
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: python demo.py

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build leafdb-core (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y g++ make
          make -C native test
          make -C native build/leafdb-core
      - name: Cross-language compat (Python <-> C++, Linux)
        if: runner.os == 'Linux'
        run: python -m unittest tests.native_compat -v
      - name: Build leafdb-core (Windows/MSVC)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile + test native (Windows/MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir native\build 2>nul
          cl /nologo /EHsc /std:c++17 /O2 /W4 /Inative\include native\src\core.cpp native\tests\test_core.cpp /Fe:native\build\test_core.exe
          native\build\test_core.exe
          cl /nologo /EHsc /std:c++17 /O2 /W4 /Inative\include native\src\core.cpp native\tools\cli.cpp /Fe:native\build\leafdb-core.exe
      - name: Cross-language compat (Python <-> C++)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m unittest tests.native_compat -v
      - name: Cross-language compat (Python <-> C++, Linux)
        if: runner.os == 'Linux'
        run: |
          make -C native build/leafdb-core
          python -m unittest tests.native_compat -v

